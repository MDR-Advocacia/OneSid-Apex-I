services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-onesid_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-onesid_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    expose:
      - "3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  processador:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: db
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOKI_APPLICATION: onesid-apex
      RPA_CHROME_NO_SANDBOX: "true"
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    shm_size: "2gb"
    command:
      [
        "sh",
        "-lc",
        "xvfb-run -a -s '-screen 0 1920x1080x24' python main.py",
      ]
    volumes:
      - app_logs:/app/logs

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: db
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOKI_APPLICATION: onesid-apex
      RPA_CHROME_NO_SANDBOX: "true"
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    shm_size: "2gb"
    command:
      [
        "sh",
        "-lc",
        "xvfb-run -a -s '-screen 0 1920x1080x24' python monitor_rpa.py",
      ]
    volumes:
      - app_logs:/app/logs

  coletor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: db
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOKI_APPLICATION: onesid-apex
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    command: ["python", "coletor_legalone.py"]
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  app_logs:
