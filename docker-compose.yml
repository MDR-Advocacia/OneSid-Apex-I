services:
  db:
    image: postgres:15-alpine
    container_name: onesid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onesid_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onesid_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onesid-net

  loki:
    image: grafana/loki:2.9.2
    container_name: onesid-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - onesid-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: onesid-grafana
    profiles: ["local-grafana"]
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - onesid-net

  processador:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onesid-processador
    restart: unless-stopped
    # init: PID 1 com reaper de zumbis (xvfb-run/sh não recolhe órfãos do Chrome)
    init: true
    # Limites duros: um vazamento de Chromes é contido pelo cgroup antes de
    # derrubar o host (incidente de 13/08/2026: 3,5 GiB e ~2.000 PIDs)
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 768
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DB_HOST: db
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOKI_APPLICATION: onesid-apex
      RPA_HEADLESS: "false"
      RPA_CHROME_NO_SANDBOX: "true"
      RPA_CHROME_DISABLE_GPU: "false"
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    shm_size: "2gb"
    command:
      [
        "sh",
        "-lc",
        "xvfb-run -a -s '-screen 0 1920x1080x24' python main.py",
      ]
    volumes:
      - ./logs:/app/logs
    networks:
      - onesid-net

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onesid-monitor
    restart: unless-stopped
    init: true
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 768
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DB_HOST: db
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOKI_APPLICATION: onesid-apex
      RPA_HEADLESS: "false"
      RPA_CHROME_NO_SANDBOX: "true"
      RPA_CHROME_DISABLE_GPU: "false"
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    shm_size: "2gb"
    command:
      [
        "sh",
        "-lc",
        "xvfb-run -a -s '-screen 0 1920x1080x24' python monitor_rpa.py",
      ]
    volumes:
      - ./logs:/app/logs
    networks:
      - onesid-net

  coletor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onesid-coletor
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DB_HOST: db
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOKI_APPLICATION: onesid-apex
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    command: ["python", "coletor_legalone.py"]
    volumes:
      - ./logs:/app/logs
    networks:
      - onesid-net

volumes:
  loki_data:
  grafana_data:

networks:
  onesid-net:
    driver: bridge
